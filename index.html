<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストップウォッチ＆タイマー</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('stopwatch', event)">ストップウォッチ</button>
            <button class="tab" onclick="switchTab('timer', event)">タイマー</button>
        </div>
        
        <div id="stopwatch" class="content active">
            <div class="display" id="stopwatchDisplay">00:00:00</div>
            <div class="controls">
                <button class="btn-start" onclick="startStopwatch()">スタート</button>
                <button class="btn-pause" onclick="pauseStopwatch()">一時停止</button>
                <button class="btn-reset" onclick="resetStopwatch()">リセット</button>
            </div>
        </div>
        
        <div id="timer" class="content">
            <div class="timer-input">
                <label>
                    <input type="number" id="minutesInput" value="5" min="0" max="99">
                    <span>分</span>
                </label>
                <label>
                    <input type="number" id="secondsInput" value="0" min="0" max="59">
                    <span>秒</span>
                </label>
            </div>
            <div class="display" id="timerDisplay">05:00</div>
            <div class="controls">
                <button class="btn-start" onclick="startTimer()">スタート</button>
                <button class="btn-pause" onclick="pauseTimer()">一時停止</button>
                <button class="btn-reset" onclick="resetTimer()">リセット</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
